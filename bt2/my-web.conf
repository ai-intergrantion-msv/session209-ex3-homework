server {
    listen 80;
    listen [::]:80;

    # Thay đổi thành domain hoặc IP của máy chủ
    server_name _;

    # Thư mục gốc chứa mã nguồn trang web
    root /var/www/my-web/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    # 1. Cấu hình sử dụng trang 404.html thay cho thông báo lỗi mặc định
    error_page 404 /404.html;

    # 2. Block location xử lý riêng cho file /404.html
    location = /404.html {
        root /var/www/my-web/html;
        # Chỉ thị internal ngăn chặn người dùng từ internet truy cập trực tiếp URL http://<IP>/404.html
        internal;
    }
}
