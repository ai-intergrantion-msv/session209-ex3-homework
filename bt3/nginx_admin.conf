server {
    listen 80;
    listen [::]:80;

    # Thay đổi thành domain hoặc IP của máy chủ
    server_name _;

    # Thư mục gốc chứa mã nguồn trang web
    root /var/www/my-web/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cấu hình bảo vệ thư mục /admin bằng HTTP Basic Authentication
    location /admin {
        # Bật tính năng xác thực và hiển thị thông báo "Restricted Admin Area" trên trình duyệt
        auth_basic "Restricted Admin Area";
        
        # Trỏ đường dẫn tuyệt đối tới file lưu mật khẩu băm đã tạo
        auth_basic_user_file /etc/nginx/.htpasswd;
        
        try_files $uri $uri/ =404;
    }
}
