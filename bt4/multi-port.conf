# Server Block cho Beta App chạy trên cổng 8080
server {
    listen 8080;
    listen [::]:8080;

    server_name _;

    # Thư mục gốc chứa mã nguồn của Beta App
    root /var/www/beta-app/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }
}

# Server Block cho Internal App chạy trên cổng 8090
server {
    listen 8090;
    listen [::]:8090;

    server_name _;

    # Thư mục gốc chứa mã nguồn của Internal App
    root /var/www/internal-app/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }
}
